name: Create TurboDrive APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create TurboDrive project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/turbodrive/app

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "TurboDrive"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.turbodrive.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.turbodrive.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>

              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="TurboDrive"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/turbodrive/app/MainActivity.kt <<'EOF'
          package com.turbodrive.app

          import android.Manifest
          import android.app.Activity
          import android.content.Context
          import android.content.pm.PackageManager
          import android.location.Location
          import android.location.LocationListener
          import android.location.LocationManager
          import android.media.AudioAttributes
          import android.media.AudioFormat
          import android.media.AudioTrack
          import android.os.Bundle
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.view.Gravity
          import android.graphics.Color
          import android.util.TypedValue
          import kotlin.math.PI
          import kotlin.math.max
          import kotlin.math.sin

          class MainActivity : Activity(), LocationListener {
              private lateinit var speedText: TextView
              private lateinit var statusText: TextView
              private lateinit var locationManager: LocationManager
              private lateinit var turboButton: Button

              @Volatile private var speedKmh = 0f
              @Volatile private var soundOn = false
              @Volatile private var engineTrack: AudioTrack? = null
              private var soundThread: Thread? = null
              private val sampleRate = 44100

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  locationManager =
                      getSystemService(Context.LOCATION_SERVICE) as LocationManager

                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(28, 30, 28, 30)
                      setBackgroundColor(Color.rgb(15, 20, 30))
                  }

                  val title = TextView(this).apply {
                      text = "TURBODRIVE"
                      setTextColor(Color.WHITE)
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 30f)
                      gravity = Gravity.CENTER
                  }
                  layout.addView(title)

                  speedText = TextView(this).apply {
                      text = "-- km/h"
                      setTextColor(Color.rgb(0, 220, 255))
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 42f)
                      gravity = Gravity.CENTER
                  }
                  layout.addView(speedText)

                  statusText = TextView(this).apply {
                      text = "GPS not started"
                      setTextColor(Color.LTGRAY)
                      gravity = Gravity.CENTER
                  }
                  layout.addView(statusText)

                  val gpsButton = Button(this).apply {
                      text = "Start GPS"
                      setOnClickListener { startGps() }
                  }
                  layout.addView(gpsButton)

                  turboButton = Button(this).apply {
                      text = "Start Speed Sound"
                      setOnClickListener {
                          if (soundOn) {
                              stopEngine()
                              text = "Start Speed Sound"
                          } else {
                              startEngine()
                              text = "Stop Speed Sound"
                          }
                      }
                  }
                  layout.addView(turboButton)

                  val blowoffButton = Button(this).apply {
                      text = "Play Blow-off Preview"
                      setOnClickListener { playWhoosh() }
                  }
                  layout.addView(blowoffButton)

                  val safetyNote = TextView(this).apply {
                      text = "Synthetic sound demo. Bluetooth uses your phone's media audio route. " +
                          "Use controls only while parked or let a passenger operate the phone."
                      setTextColor(Color.LTGRAY)
                      gravity = Gravity.CENTER
                      setPadding(0, 24, 0, 0)
                  }
                  layout.addView(safetyNote)

                  setContentView(layout)
              }

              private fun startGps() {
                  if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION)
                      != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(
                          arrayOf(
                              Manifest.permission.ACCESS_FINE_LOCATION,
                              Manifest.permission.ACCESS_COARSE_LOCATION
                          ), 100
                      )
                      return
                  }

                  try {
                      locationManager.requestLocationUpdates(
                          LocationManager.GPS_PROVIDER, 1000L, 0f, this
                      )
                      statusText.text = "Waiting for GPS fix..."
                  } catch (_: Exception) {
                      statusText.text = "GPS unavailable. Check Location settings."
                  }
              }

              override fun onLocationChanged(location: Location) {
                  speedKmh = max(0f, location.speed * 3.6f)
                  speedText.text = "${speedKmh.toInt()} km/h"
                  statusText.text = "GPS connected"
              }

              private fun startEngine() {
                  if (soundOn) return
                  soundOn = true

                  val audioFormat = AudioFormat.Builder()
                      .setSampleRate(sampleRate)
                      .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                      .setChannelMask(AudioFormat.CHANNEL_OUT_MONO)
                      .build()

                  val audioAttributes = AudioAttributes.Builder()
                      .setUsage(AudioAttributes.USAGE_MEDIA)
                      .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                      .build()

                  val track = AudioTrack.Builder()
                      .setAudioAttributes(audioAttributes)
                      .setAudioFormat(audioFormat)
                      .setBufferSizeInBytes(8192)
                      .setTransferMode(AudioTrack.MODE_STREAM)
                      .build()

                  engineTrack = track
                  track.setVolume(0.18f)
                  track.play()

                  soundThread = Thread {
                      val buffer = ShortArray(2048)
                      var phase = 0.0

                      while (soundOn) {
                          // Speed changes the pitch of this synthetic engine-like tone.
                          val frequency = 65.0 + speedKmh.coerceIn(0f, 180f) * 2.2

                          for (i in buffer.indices) {
                              phase += 2.0 * PI * frequency / sampleRate
                              if (phase >= 2.0 * PI) phase -= 2.0 * PI

                              val wave = sin(phase) * 0.65 +
                                  sin(phase * 2.0) * 0.20 +
                                  sin(phase * 3.0) * 0.10

                              buffer[i] = (wave * 4500).toInt().toShort()
                          }

                          try {
                              track.write(buffer, 0, buffer.size, AudioTrack.WRITE_BLOCKING)
                          } catch (_: Exception) {
                              break
                          }
                      }
                  }.apply { isDaemon = true }

                  soundThread?.start()
              }

              private fun stopEngine() {
                  soundOn = false
                  try {
                      engineTrack?.pause()
                      engineTrack?.flush()
                      engineTrack?.stop()
                      engineTrack?.release()
                  } catch (_: Exception) {
                  }
                  engineTrack = null
                  soundThread = null
              }

              private fun playWhoosh() {
                  val count = sampleRate / 2
                  val samples = ShortArray(count)

                  for (i in samples.indices) {
                      val progress = i.toDouble() / count
                      val envelope = 1.0 - progress
                      val frequency = 900.0 - progress * 650.0
                      val tone = sin(2.0 * PI * frequency * progress)
                      val noise = sin(i * 12.9898) * 0.25
                      samples[i] = ((tone + noise) * envelope * 3500)
                          .toInt().toShort()
                  }

                  val format = AudioFormat.Builder()
                      .setSampleRate(sampleRate)
                      .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                      .setChannelMask(AudioFormat.CHANNEL_OUT_MONO)
                      .build()

                  val attributes = AudioAttributes.Builder()
                      .setUsage(AudioAttributes.USAGE_MEDIA)
                      .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                      .build()

                  try {
                      val track = AudioTrack.Builder()
                          .setAudioAttributes(attributes)
                          .setAudioFormat(format)
                          .setBufferSizeInBytes(samples.size * 2)
                          .setTransferMode(AudioTrack.MODE_STATIC)
                          .build()

                      track.setVolume(0.20f)
                      track.write(samples, 0, samples.size)
                      track.play()

                      Thread {
                          Thread.sleep(900)
                          try {
                              track.release()
                          } catch (_: Exception) {
                          }
                      }.apply { isDaemon = true }.start()
                  } catch (_: Exception) {
                  }
              }

              override fun onRequestPermissionsResult(
                  requestCode: Int,
                  permissions: Array<out String>,
                  grantResults: IntArray
              ) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == 100 &&
                      grantResults.isNotEmpty() &&
                      grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                      startGps()
                  }
              }

              override fun onDestroy() {
                  stopEngine()
                  try {
                      locationManager.removeUpdates(this)
                  } catch (_: Exception) {
                  }
                  super.onDestroy()
              }
          }
          EOF

          echo "TurboDrive project generated."

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TurboDrive-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
