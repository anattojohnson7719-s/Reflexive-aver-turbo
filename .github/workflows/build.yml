
name: Create TurboDrive APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create TurboDrive project
        run: |
          mkdir -p app/src/main/java/com/turbodrive/app

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "TurboDrive"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.turbodrive.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.turbodrive.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>

              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="TurboDrive"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/turbodrive/app/MainActivity.kt <<'EOF'
          package com.turbodrive.app

          import android.Manifest
          import android.app.Activity
          import android.content.Context
          import android.content.pm.PackageManager
          import android.location.Location
          import android.location.LocationListener
          import android.location.LocationManager
          import android.media.AudioAttributes
          import android.media.AudioFormat
          import android.media.AudioManager
          import android.media.AudioTrack
          import android.os.Bundle
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.view.Gravity
          import android.graphics.Color
          import android.content.res.ColorStateList
          import android.util.TypedValue
          import kotlin.math.sin
          import kotlin.math.PI
          import kotlin.math.max
          import kotlin.math.min

          class MainActivity : Activity(), LocationListener {

              private lateinit var speedText: TextView
              private lateinit var statusText: TextView
              private lateinit var locationManager: LocationManager

              @Volatile private var speedKmh = 0f
              @Volatile private var soundOn = false
              @Volatile private var engineTrack: AudioTrack? = null
              private var soundThread: Thread? = null

              private val sampleRate = 44100

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  locationManager =
                      getSystemService(Context.LOCATION_SERVICE) as LocationManager

                  val layout = LinearLayout(this)
                  layout.orientation = LinearLayout.VERTICAL
                  layout.gravity = Gravity.CENTER
                  layout.setPadding(28, 30, 28, 30)
                  layout.setBackgroundColor(Color.rgb(15, 20, 30))

                  val title = TextView(this)
                  title.text = "TURBODRIVE"
                  title.setTextColor(Color.WHITE)
                  title.setTextSize(TypedValue.COMPLEX_UNIT_SP, 30f)
                  title.gravity = Gravity.CENTER
                  layout.addView(title)

                  speedText = TextView(this)
                  speedText.text = "0 km/h"
                  speedText.setTextColor(Color.rgb(0, 220, 255))
                  speedText.setTextSize(TypedValue.COMPLEX_UNIT_SP, 42f)
                  speedText.gravity = Gravity.CENTER
                  layout.addView(speedText)

                  statusText = TextView(this)
                  statusText.text = "GPS not started"
                  statusText.setTextColor(Color.LTGRAY)
                  statusText.gravity = Gravity.CENTER
                  layout.addView(statusText)

                  val gpsButton = Button(this)
                  gpsButton.text = "Start GPS"
                  gpsButton.setOnClickListener { startGps() }
                  layout.addView(gpsButton)

                  val soundButton = Button(this)
                  soundButton.text = "Start Turbo Sound"
                  soundButton.setOnClickListener {
                      if (soundOn) {
                          stopEngine()
                          soundButton.text = "Start Turbo Sound"
                      } else {
                          startEngine()
                          soundButton.text = "Stop Turbo Sound"
                      }
                  }
                  layout.addView(soundButton)

                  val boostButton = Button(this)
                  boostButton.text = "Blow-off Sound"
                  boostButton.setOnClickListener { playWhoosh() }
                  layout.addView(boostButton)

                  val note = TextView(this)
                  note.text =
                      "Demo sound only. Use while parked or by a passenger. " +
                      "Never operate or adjust the phone while driving."
                  note.setTextColor(Color.LTGRAY)
                  note.gravity = Gravity.CENTER
                  note.setPadding(0, 24, 0, 0)
                  layout.addView(note)

                  setContentView(layout)
              }

              private fun startGps() {
                  if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION)
                      != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(
                          arrayOf(
                              Manifest.permission.ACCESS_FINE_LOCATION,
                              Manifest.permission.ACCESS_COARSE_LOCATION
                          ), 100
                      )
                      return
                  }

                  try {
                      locationManager.requestLocationUpdates(
                          LocationManager.GPS_PROVIDER,
                          1000L,
                          0f,
                          this
                      )
                      statusText.text = "Waiting for GPS..."
                  } catch (e: Exception) {
                      statusText.text = "GPS unavailable"
                  }
              }

              override fun onLocationChanged(location: Location) {
                  speedKmh = max(0f, location.speed * 3.6f)
                  speedText.text = "${speedKmh.toInt()} km/h"
                  statusText.text = "GPS connected"
              }

              private fun startEngine() {
                  if (soundOn) return
                  soundOn = true

                  val format = AudioFormat.Builder()
                      .setSampleRate(sampleRate)
                      .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                      .setChannelMask(AudioFormat.CHANNEL_OUT_MONO)
                      .build()

                  val attributes = AudioAttributes.Builder()
                      .setUsage(AudioAttributes.USAGE_MEDIA)
                      .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                      .build()

                  val bufferSize = sampleRate / 4 * 2

                  val track = AudioTrack.Builder()
                      .setAudioAttributes(attributes)
                      .setAudioFormat(format)
                      .setBufferSizeInBytes(bufferSize)
                      .setTransferMode(AudioTrack.MODE_STREAM)
                      .build()

                  engineTrack = track
                  track.setVolume(0.20f)
                  track.play()

                  soundThread = Thread {
                      val buffer = ShortArray(2048)
                      var phase = 0.0

                      while (soundOn) {
                          val speed = speedKmh
                          val frequency = 70.0 + speed * 2.0

                          for (i in buffer.indices) {
                              phase += 2.0 * PI * frequency / sampleRate
                              if (phase > 2.0 * PI) phase -= 2.0 * PI

                              val wave =
                                  sin(phase) * 0.65 +
                                  sin(phase * 2.0) * 0.20 +
                                  sin(phase * 3.0) * 0.10

                              buffer[i] = (wave * 5000).toInt().toShort()
                          }

                          try {
                              track.write(
                                  buffer, 0, buffer.size,
                                  AudioTrack.WRITE_BLOCKING
                              )
                          } catch (_: Exception) {
                              break
                          }
                      }
                  }

                  soundThread?.start()
              }

              private fun stopEngine() {
                  soundOn = false

                  try {
                      engineTrack?.pause()
                      engineTrack?.flush()
                      engineTrack?.stop()
                      engineTrack?.release()
                  } catch (_: Exception) {}

                  engineTrack = null
                  soundThread = null
              }

              private fun playWhoosh() {
                  val count = sampleRate / 2
                  val samples = ShortArray(count)

                  for (i in samples.indices) {
                      val progress = i.toDouble() / count
                      val envelope = 1.0 - progress
                      val frequency = 900.0 - progress * 650.0
                      val noise = sin(i * 12.9898) * 0.35
                      val tone = sin(2.0 * PI * frequency * progress)
                      samples[i] = ((tone + noise) * envelope * 4500)
                          .toInt().toShort()
                  }

                  val format = AudioFormat.Builder()
                      .setSampleRate(sampleRate)
                      .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                      .setChannelMask(AudioFormat.CHANNEL_OUT_MONO)
                      .build()

                  val attributes = AudioAttributes.Builder()
                      .setUsage(AudioAttributes.USAGE_MEDIA)
                      .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                      .build()

                  try {
                      val track = AudioTrack.Builder()
                          .setAudioAttributes(attributes)
                          .setAudioFormat(format)
                          .setBufferSizeInBytes(samples.size * 2)
                          .setTransferMode(AudioTrack.MODE_STATIC)
                          .build()

                      track.setVolume(0.25f)
                      track.write(samples, 0, samples.size)
                      track.play()

                      Thread {
                          Thread.sleep(700)
                          try {
                              track.release()
                          } catch (_: Exception) {}
                      }.start()
                  } catch (_: Exception) {}
              }

              override fun onRequestPermissionsResult(
                  requestCode: Int,
                  permissions: Array<out String>,
                  grantResults: IntArray
              ) {
                  super.onRequestPermissionsResult(
                      requestCode, permissions, grantResults
                  )

                  if (requestCode == 100 &&
                      grantResults.isNotEmpty() &&
                      grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                      startGps()
                  }
              }

              override fun onDestroy() {
                  stopEngine()
                  try {
                      locationManager.removeUpdates(this)
                  } catch (_: Exception) {}
                  super.onDestroy()
              }
          }
          EOF

          echo "Project files created."

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TurboDrive-APK
          path: app/build/outputs/apk/debug/*.apk
          
